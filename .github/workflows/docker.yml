# Publica a imagem da rotagest-api no GitHub Container Registry (GHCR).
# Não faz deploy em servidor: a imagem é o artefato entregue (ver docs/DEPLOY.md).
#   push na main  -> ghcr.io/<owner>/rotagest-api:main e :sha-<commit>
#   tag v1.2.3    -> :1.2.3, :1.2, :latest e :sha-<commit>
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build e push para o GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # O nome da imagem no GHCR precisa ser minúsculo; o metadata-action já normaliza.
          images: ghcr.io/${{ github.repository_owner }}/rotagest-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
